name: Release

on:
  push:
    tags:
      - '**' # Matches any tag including those with slashes
  workflow_dispatch: # Allows manual triggering from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Opt-in to Node 24 to clear deprecation warnings

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Seit dem Monorepo-Umzug lebt die Desktop-Seite hier mit. Die Tests laufen
      # ohne Netz und ohne calibre (stdlib only), also braucht dieser Schritt kein
      # requirements-Handling -- und ein rotes Baum-Ergebnis kann kein Release mehr
      # erzeugen, weil der Job hier abbricht.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Create Plugin Archive
        run: |
          # Package the plugin directory into a zip file
          # Excluding hidden files and git metadata
          zip -r xray.koplugin.zip xray.koplugin -x "*.git*" "*/.*"

      # Zweites Artefakt aus demselben Tag: das calibre-Plugin. Ein Repo, eine
      # Version, ein Release -- der Dateiname trägt die Version aus VERSION.
      - name: Create calibre Plugin Archive
        run: python tools/build_calibre_plugin.py

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            xray.koplugin.zip
            dist/xray-generator-*.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
